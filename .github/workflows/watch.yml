name: 学科試験の空き枠チェック

# 1回の実行で約5時間半動き続け、サーバー側キャッシュの作り直しに合わせて見張る。
# cron-job.org が5分おきに起動を頼み、実行中なら1本だけ順番待ちになる(終わり次第すぐ次が動く)。
on:
  schedule:
    - cron: "2-59/5 * * * *" # 保険。GitHub の定期実行は当てにならないので主役は cron-job.org
  workflow_dispatch:
    inputs:
      test_notify:
        description: "テスト通知だけ送る"
        type: boolean
        default: false
      simulate:
        description: "空き枠が出たことにして通知する(実データで本番と同じ流れ)"
        type: boolean
        default: false

concurrency:
  # テスト実行は見張りの後ろに並ばせず、すぐ動かす
  group: ${{ (inputs.test_notify || inputs.simulate) && format('test-{0}', github.run_id) || 'watch' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      # 前回の結果(state.json)を取り出す
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: 空き枠を見張る
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test_notify && '1' || '' }}
          SIMULATE: ${{ inputs.simulate && '1' || '' }}
          LOOP_MINUTES: ${{ (inputs.test_notify || inputs.simulate) && '' || '330' }}
          PYTHONUNBUFFERED: "1"
        run: python3 watch.py

      # 今回の結果を次回のために保存する
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
